<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courses and Tasks – Smart Study Planner</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="tasks">
<div class="app">
<nav class="side" id="side" aria-label="Main menu"></nav>
<main>
<div class="top"><h1>Courses &amp; Tasks</h1></div>
<div class="row">
  <div style="width:250px;flex:none">
    <div class="card"><h2>My courses</h2><div id="courseList"></div></div>
    <form class="card" id="courseForm" style="margin-top:12px" novalidate><h2>Add course</h2>
      <label for="cc">Course code</label><input id="cc" name="course_code" placeholder="CSC 305"><div class="err" data-err="course_code"></div>
      <label for="cn">Course name</label><input id="cn" name="course_name" placeholder="Database Systems"><div class="err" data-err="course_name"></div>
      <label for="ch">Credit hours</label><input id="ch" name="credit_hours" type="number" value="3" min="0" max="6"><div class="err" data-err="credit_hours"></div>
      <button type="submit" style="margin-top:10px">+ Add course</button></form>
  </div>
  <div class="grow hidden" id="taskArea">
    <div id="weightWarn" class="msg warn hidden" role="alert"></div>
    <div class="card"><h2 id="courseTitle"></h2>
      <div style="overflow-x:auto"><table><thead><tr><th>Task</th><th>Type</th><th>Deadline</th><th>Weight</th><th>Difficulty</th><th>Hours</th><th>Status</th><th>Actions</th></tr></thead><tbody id="taskRows"></tbody></table></div></div>
    <form class="card" id="taskForm" style="margin-top:12px" novalidate><h2>Add task</h2>
      <div class="grid" style="grid-template-columns:2fr 1fr 1.4fr;gap:0 12px">
        <div><label for="tt1">Title</label><input id="tt1" name="title"><div class="err" data-err="title"></div></div>
        <div><label for="tt2">Type</label><select id="tt2" name="task_type"><option value="assignment">Assignment</option><option value="exam">Exam</option><option value="quiz">Quiz</option><option value="project">Project</option><option value="reading">Reading</option></select><div class="err" data-err="task_type"></div></div>
        <div><label for="tt3">Deadline</label><input id="tt3" name="deadline" type="datetime-local"><div class="err" data-err="deadline"></div></div>
        <div><label for="tt4">Grade weight (%)</label><input id="tt4" name="grade_weight" type="number" step="0.5"><div class="err" data-err="grade_weight"></div></div>
        <div><label for="tt5">Difficulty (1–5)</label><select id="tt5" name="difficulty"><option>1</option><option>2</option><option selected>3</option><option>4</option><option>5</option></select><div class="err" data-err="difficulty"></div></div>
        <div><label for="tt6">Estimated hours</label><input id="tt6" name="estimated_hours" type="number" step="0.5" min="0.5"><div class="err" data-err="estimated_hours"></div></div>
      </div>
      <div style="text-align:right;margin-top:12px"><button type="submit">Save task</button></div></form>
  </div>
</div>
</main>
</div>
<script src="/js/app.js"></script>
</body>
</html>
