<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advisor Portal – Smart Study Planner</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="advisor">
<div class="app">
<nav class="side" id="side" aria-label="Main menu"></nav>
<main>
<div class="top"><h1>Advisor Portal</h1></div>
<div class="row">
  <div class="card" style="width:380px;flex:none"><h2>Students sharing progress</h2>
    <table><thead><tr><th>Student</th><th>Completion</th><th>Overdue</th></tr></thead><tbody id="students"></tbody></table>
    <p class="muted">Click a student to see the weekly summary.</p></div>
  <div class="card grow" id="summary"><p class="muted">Select a student.</p></div>
</div>
</main>
</div>
<script src="/js/app.js"></script>
</body>
</html>
