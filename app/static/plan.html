<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Study Plan – Smart Study Planner</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="plan">
<div class="app">
<nav class="side" id="side" aria-label="Main menu"></nav>
<main>
<div class="top"><div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><h1>Study Plan</h1>
  <button class="ghost small" id="prev" aria-label="Previous week">◀</button><b id="weekLabel"></b><button class="ghost small" id="next" aria-label="Next week">▶</button></div>
  <div><button id="generate">⟳ Generate plan</button> <button class="ghost" id="export">⬇ Export .ics</button></div></div>
<div id="risk"></div>
<div class="row">
  <div class="card grow" style="padding:8px"><div class="tt" id="tt"></div></div>
  <div style="width:270px;flex:none">
    <div class="card" id="detail" style="border:2px solid #2563eb"></div>
    <div class="card" style="margin-top:12px;font-size:12px;line-height:1.8"><b>Legend</b><br><span id="legend"></span></div>
  </div>
</div>
</main>
</div>
<script src="/js/app.js"></script>
</body>
</html>
