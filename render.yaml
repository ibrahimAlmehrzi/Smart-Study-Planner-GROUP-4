services:
  - type: web
    name: smart-study-planner
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt gunicorn
    startCommand: python manage.py reset-demo && gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT "app:create_app()"
    envVars:
      - key: SECRET_KEY
        generateValue: true
