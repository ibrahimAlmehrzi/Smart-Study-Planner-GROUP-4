<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard – Smart Study Planner</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body data-page="dashboard">
<div class="app">
<nav class="side" id="side" aria-label="Main menu"></nav>
<main>
<div class="top"><h1>Progress Dashboard</h1></div>
<div class="grid g4" id="cards"></div>
<div class="grid g2" style="margin-top:12px">
  <div class="card"><h2>Planned vs completed sessions</h2><div class="bars" id="weekChart"></div>
    <div style="font-size:11px;margin-top:6px"><span style="color:#cbd5e1">■</span> Planned &nbsp; <span style="color:#2563eb">■</span> Completed</div></div>
  <div class="card"><h2>Completion by course</h2><div id="courseChart"></div></div>
</div>
<div class="grid g2" style="margin-top:12px">
  <div class="card"><h2>Top priorities</h2><table><thead><tr><th>#</th><th>Task</th><th>Why</th><th>Score</th></tr></thead><tbody id="ranked"></tbody></table></div>
  <div class="card"><h2>Upcoming deadlines</h2><div id="upcoming" style="line-height:2"></div></div>
</div>
</main>
</div>
<script src="/js/app.js"></script>
</body>
</html>
